name: PR

on:
  pull_request:
    branches: [main]
    # `ready_for_review` is not one of the default activity types, so a draft PR
    # would never re-evaluate the required gate once it is marked ready for review.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The organisation gate every purview-dev repository runs. `.config/purview-build.json`
  # sets `ProjectType: Web`, so the shared pipeline installs, builds (grammar
  # snapshot → type-check → playground build) and tests this package — the same
  # arrangement `purview-dev.github.io` uses for its site. Pack and pack
  # validation stay off: astroc4 ships to npm, not NuGet.
  build:
    name: Build and test
    # The shared workflow declares `contents: read` **and** `packages: read`, and
    # a called workflow may not request more than its caller grants — GitHub
    # rejects the whole run at startup otherwise, with only "workflow file issue"
    # to go on. Mirror its declaration here.
    permissions:
      contents: read
      packages: read
    uses: purview-dev/build/.github/workflows/purview-build.yml@main
    with:
      run-pack: false
      validate-pack: false
    secrets: inherit

  # The one test that talks to likec4/likec4, kept out of the shared gate so a
  # red run says "upstream moved the grammar" (or GitHub is down) rather than
  # "this branch broke something".
  live-grammar:
    name: Live grammar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          # Single source of truth for the toolchain; `engines.bun` in
          # package.json is the floor and this is the version it is tested on.
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Read the grammar from likec4/likec4 and check it derives
        run: bun run test:network

  smoke:
    name: Browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Astro enforces its `engines.node` floor against whatever CLI runs it, and
      # the runner image's Node trails the newest requirement by a patch or two.
      # Pin the real CLI so `bun run build`/`preview` and Playwright all agree.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # The smoke test drives Chromium, so the browser has to be present. A
      # static build passes even when islands fail to hydrate — only this
      # proves the diagrams draw.
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - run: bun run build

      - name: Start the preview server and smoke test it
        run: |
          set -euo pipefail

          bun run preview > preview.log 2>&1 &

          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:4321/ > /dev/null; then
              break
            fi
            sleep 1
          done

          bun scripts/smoke.ts http://localhost:4321

      - name: Preview log
        if: failure()
        run: cat preview.log

  site:
    name: Packed consumer site
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # `test-site.ts` runs the consumer's Astro CLI with the *real* `node` (Bun
      # reports an emulated Node version that Astro rejects), so the runner's Node
      # has to satisfy Astro's floor. It is not this package's floor, which is why
      # it is pinned here rather than derived from `engines`.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # What ships, not what is in the working tree: `npm pack`, then a
      # throwaway Starlight site outside the repository installs the tarball
      # from the registry, type-checks against its declaration files and
      # builds. The playground imports `dist/` from the repository, so it cannot
      # catch a broken `files` field, a missing `dist/` file, or an `exports`
      # subpath that does not resolve.
      - name: Build a real Starlight site from the packed package
        run: bun run test:site
